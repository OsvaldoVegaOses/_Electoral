# =============================================================================
# TheoGen Electoral — Configuración Nginx para Producción con SSL
# =============================================================================
# Ubicación en servidor: /etc/nginx/sites-available/theogen.conf
# Enlace simbólico: sudo ln -s /etc/nginx/sites-available/theogen.conf /etc/nginx/sites-enabled/
# =============================================================================

# Zonas de limitación de tasa (Rate Limiting) para protección contra abusos
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=vote_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# 1. Redirección HTTP -> HTTPS obligatoria
server {
    listen 80;
    listen [::]:80;
    server_name votaciones.theogen.cl;

    # Verificación de Certbot Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Seguro HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name votaciones.theogen.cl;

    # Certificados SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/votaciones.theogen.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votaciones.theogen.cl/privkey.pem;

    # Protocolos y Cifrados Seguros (A+ SSL Labs)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Ocultar versión de Nginx
    server_tokens off;

    # Cabeceras de Seguridad HTTP estrictas
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self';" always;

    # Compresión Gzip para alto rendimiento en clientes móviles
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Tamaño máximo para carga de padrón electoral (Excel / CSV)
    client_max_body_size 15M;

    # Proxy para el Frontend SPA (React + Vite en puerto local 3000)
    location / {
        limit_req zone=general_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para el Endpoint Crítico de Emisión de Voto (Rate Limiting específico)
    location /api/voting/submit {
        limit_req zone=vote_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000/api/voting/submit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para Validación de Credenciales de Votación (Protección anti-enumeración)
    location /api/voting/validate-token {
        limit_req zone=vote_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000/api/voting/validate-token;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para el Login Administrativo (Protección anti fuerza bruta)
    location /api/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para el resto de la API REST (FastAPI en puerto local 8000)
    location /api/ {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts generosos para generación de actas en PDF y procesamiento de padrón
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
