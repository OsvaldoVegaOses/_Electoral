# =============================================================================
# TheoGen Electoral — Docker Compose para Producción
# =============================================================================
# Uso: docker compose -f docker-compose.prod.yml up -d --build
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: theogen_db
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-theogen_electoral}
      POSTGRES_USER: ${POSTGRES_USER:-theogen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # SEGURIDAD: Puerto 5432 NO se expone al host en producción
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-theogen} -d ${POSTGRES_DB:-theogen_electoral}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: theogen_backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      VOTE_HMAC_KEY: ${VOTE_HMAC_KEY}
      ENVIRONMENT: production
    # Solo expuesto a localhost para que el Reverse Proxy Nginx del host o contenedor lo consuma
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: theogen_frontend
    restart: unless-stopped
    # Solo expuesto a localhost para que el Reverse Proxy Nginx del host lo consuma
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - frontend_net
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  postgres_data:
    name: theogen_postgres_data
