name: CI Pipeline

on:
  push:
    branches: [ main, develop, 'fix/**', 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Migrations (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: theogen_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Alembic Migrations (Upgrade -> Downgrade -> Upgrade)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/theogen_test
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/theogen_test
          ENVIRONMENT: test
          SECRET_KEY: test_ci_secret_key_very_secure_and_long_32bytes
          VOTE_HMAC_KEY: test_ci_vote_hmac_key_secure_32bytes
        run: |
          cd backend
          pytest tests -v

      - name: ADR-001 PostgreSQL concurrency and provider isolation
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/theogen_test
          ADR001_TEST_PG_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/theogen_test
          ENVIRONMENT: test
          SECRET_KEY: test_ci_secret_key_very_secure_and_long_32bytes
          VOTE_HMAC_KEY: test_ci_vote_hmac_key_secure_32bytes
        run: |
          cd backend
          pytest tests/test_belenios_postgres.py -v

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend Linter Check
        run: |
          cd frontend
          npm run lint

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build

      - name: ADR-001 browser contracts (synthetic API doubles only)
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.belenios.config.js

  security-audit:
    name: Security Scan (pip-audit & Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Scan Dependencies for Known CVEs (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Detect Secrets and Token Leaks (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

