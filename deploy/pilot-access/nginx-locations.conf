  # In the enclosing HTTPS server use: add_header Referrer-Policy same-origin always;
  # A single proxy policy avoids Origin:null on browser form submissions.
  location = /acceso { return 303 /acceso/; }
  location ^~ /acceso/ {
    proxy_hide_header Referrer-Policy;
    proxy_pass http://127.0.0.1:18445;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection close;
    proxy_read_timeout 30s;
  }
  location = /api-token {
    proxy_hide_header Referrer-Policy;
    proxy_pass http://127.0.0.1:18445;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection close;
    proxy_read_timeout 30s;
  }
  location = /api/login {
    proxy_hide_header Referrer-Policy;
    proxy_pass http://127.0.0.1:18445;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection close;
    proxy_read_timeout 30s;
  }
  location = /login { return 303 /acceso/; }
